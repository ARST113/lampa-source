name: Lampa Full Stack Lab Watchdog

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lampa-full-stack-lab-watchdog
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout trusted watchdog
        uses: actions/checkout@v7

      - name: Verify watchdog logic
        run: |
          python3 -m unittest spec/test_lab_watchdog.py
          python3 -m py_compile scripts/lab/watchdog.py

      - name: Ensure Full Stack Lab is available
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_NAME: lampa-full-stack-lab-r54vrp44jj4cx796
          LAB_SOURCE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/watchdog.py
