name: Lampa Full Stack Lab Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: Lab action
        type: choice
        required: true
        default: status
        options:
          - status
          - ensure
          - start
          - stop
          - restart
          - smoke
          - full
          - logs
  schedule:
    - cron: '17 */4 * * *'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: lampa-full-stack-lab-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve lab command
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ACTION: ${{ inputs.action }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          event_name = os.environ['EVENT_NAME']
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          allowed = {'status', 'ensure', 'start', 'stop', 'restart', 'smoke', 'full', 'logs'}
          action = None
          issue_number = ''

          if event_name == 'schedule':
              action = 'ensure'
          elif event_name == 'workflow_dispatch':
              candidate = os.environ.get('DISPATCH_ACTION', 'status')
              if candidate in allowed:
                  action = candidate
          elif event_name == 'issue_comment':
              issue = event.get('issue') or {}
              comment = event.get('comment') or {}
              if issue.get('title') == 'Lampa Full Stack Lab Control':
                  body = (comment.get('body') or '').strip()
                  match = re.fullmatch(r'/lab +(status|ensure|start|stop|restart|smoke|full|logs)', body)
                  if match:
                      action = match.group(1)
                      issue_number = str(issue.get('number') or '')

          print(f"run={'true' if action else 'false'}")
          print(f"action={action or 'status'}")
          print(f"issue_number={issue_number}")
          PY

      - name: Execute lab command
        if: steps.route.outputs.run == 'true'
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/codespace_control.py "${{ steps.route.outputs.action }}"

      - name: Set up Node.js for full browser test
        if: ${{ steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full' }}
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install browser test dependencies
        if: ${{ steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full' }}
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium for full test
        if: ${{ steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full' }}
        run: npx playwright install --with-deps chromium

      - name: Prepare live Lampac backend URL
        if: ${{ steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full' }}
        shell: bash
        run: |
          backend="$(python3 -c "import json; print(json.load(open('lab-artifacts/status.json'))['backend'])")"
          test -n "$backend"
          echo "LAMPA_TEST_LAMPAC_URL=$backend" >> "$GITHUB_ENV"
          echo "LAMPA_TEST_PAGES_URL=https://arst113.github.io/lampa-source/test/" >> "$GITHUB_ENV"

      - name: Run live Lampac browser test
        if: ${{ steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full' }}
        run: bash scripts/lab/run-with-heartbeat.sh npm run test:e2e:backend

      - name: Upload live browser diagnostics
        if: always() && steps.route.outputs.run == 'true' && steps.route.outputs.action == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: lab-playwright-${{ github.run_id }}
          path: |
            playwright-report-live/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lab diagnostics
        if: always() && steps.route.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lab-status-${{ github.run_id }}
          path: lab-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Reply in control issue
        if: always() && github.event_name == 'issue_comment' && steps.route.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.route.outputs.issue_number }}
        shell: bash
        run: |
          if [[ -n "$ISSUE_NUMBER" && -f lab-artifacts/summary.md ]]; then
            gh issue comment "$ISSUE_NUMBER" --body-file lab-artifacts/summary.md
          fi
