name: Lampa Full Stack Lab Bootstrap

on:
  push:
    branches:
      - feat/github-full-stack-lab
    paths:
      - '.github/workflows/lab-bootstrap.yml'
      - '.devcontainer/**'
      - 'scripts/lab/codespace_control.py'

permissions:
  contents: read

concurrency:
  group: lampa-full-stack-lab-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Ensure real Codespace lab
        id: ensure
        continue-on-error: true
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/codespace_control.py ensure

      - name: Resolve existing Codespace
        if: always()
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/codespace_control.py status

      - name: Capture remote diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        shell: bash
        run: |
          set -u
          name="$(python3 - <<'PY'
          import json
          try:
              print(json.load(open('lab-artifacts/status.json'))['name'] or '')
          except Exception:
              print('')
          PY
          )"
          if [[ -z "$name" ]]; then
            echo 'No Codespace name available for SSH diagnostics.'
            exit 0
          fi

          mkdir -p lab-artifacts
          {
            echo '=== remote docker ps ==='
            gh codespace ssh -c "$name" -- bash -lc 'docker ps -a || true'
            echo
            echo '=== workspace ==='
            gh codespace ssh -c "$name" -- bash -lc 'pwd; echo CODESPACE_VSCODE_FOLDER=${CODESPACE_VSCODE_FOLDER:-}; ls -la "${CODESPACE_VSCODE_FOLDER:-/workspaces/lampa-source}/.devcontainer" 2>&1 || true'
            echo
            echo '=== local 9118 ==='
            gh codespace ssh -c "$name" -- bash -lc 'curl -sv --max-time 10 http://127.0.0.1:9118/version?type=hash 2>&1 || true'
            echo
            echo '=== Lampac compose logs ==='
            gh codespace ssh -c "$name" -- bash -lc 'cd "${CODESPACE_VSCODE_FOLDER:-/workspaces/lampa-source}" && docker compose -f .devcontainer/lab.compose.yml logs --tail=250 lampac 2>&1 || true'
          } | tee lab-artifacts/remote-diagnostics.txt

      - name: Fail when ensure failed
        if: steps.ensure.outcome != 'success'
        run: exit 1

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-bootstrap-${{ github.run_id }}
          path: lab-artifacts/
          if-no-files-found: ignore
          retention-days: 14
