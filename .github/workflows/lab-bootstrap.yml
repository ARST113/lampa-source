name: Lampa Full Stack Lab Bootstrap

on:
  push:
    branches:
      - feat/github-full-stack-lab
    paths:
      - '.github/workflows/lab-bootstrap.yml'
      - '.devcontainer/**'
      - 'scripts/lab/codespace_control.py'

permissions:
  contents: read

concurrency:
  group: lampa-full-stack-lab-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Recreate lab from current devcontainer
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lab/codespace_control.py status
          name="$(python3 - <<'PY'
          import json
          try:
              print(json.load(open('lab-artifacts/status.json')).get('name') or '')
          except Exception:
              print('')
          PY
          )"

          if [[ -n "$name" ]]; then
            echo "Deleting previous experimental Codespace: $name"
            gh codespace delete -c "$name" -f

            for i in $(seq 1 60); do
              if ! gh codespace list --json name --jq '.[].name' | grep -Fxq "$name"; then
                break
              fi
              sleep 2
            done
          fi

          rm -rf lab-artifacts

      - name: Ensure real Codespace lab
        id: ensure
        continue-on-error: true
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/codespace_control.py ensure

      - name: Resolve existing Codespace
        if: always()
        env:
          CODESPACES_PAT: ${{ secrets.CODESPACES_PAT }}
          LAB_CODESPACE_REF: feat/github-full-stack-lab
        run: python3 scripts/lab/codespace_control.py status

      - name: Capture real Codespace diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        shell: bash
        run: |
          set -u
          name="$(python3 - <<'PY'
          import json
          try:
              print(json.load(open('lab-artifacts/status.json'))['name'] or '')
          except Exception:
              print('')
          PY
          )"
          if [[ -z "$name" ]]; then
            echo 'No Codespace name available for diagnostics.'
            exit 0
          fi

          mkdir -p lab-artifacts
          {
            echo '=== forwarded ports ==='
            gh codespace ports -c "$name" --json sourcePort,visibility,browseUrl || true
            echo
            echo '=== remote docker ps ==='
            gh codespace ssh -c "$name" -- bash -lc 'docker ps -a || true' || true
            echo
            echo '=== local 9118 ==='
            gh codespace ssh -c "$name" -- bash -lc 'curl -sv --max-time 10 http://127.0.0.1:9118/version?type=hash 2>&1 || true' || true
            echo
            echo '=== Lampac compose logs ==='
            gh codespace ssh -c "$name" -- bash -lc 'cd "${CODESPACE_VSCODE_FOLDER:-/workspaces/lampa-source}" && docker compose -f .devcontainer/lab.compose.yml logs --tail=250 lampac 2>&1 || true' || true
            echo
            echo '=== unauthenticated public health ==='
            backend="https://${name}-9118.app.github.dev"
            curl -sS -D - --max-time 20 "$backend/version?type=hash" -o /tmp/lab-public-body || true
            head -c 1000 /tmp/lab-public-body 2>/dev/null || true
            echo
          } | tee lab-artifacts/remote-diagnostics.txt

      - name: Fail when ensure failed
        if: steps.ensure.outcome != 'success'
        run: exit 1

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-bootstrap-${{ github.run_id }}
          path: lab-artifacts/
          if-no-files-found: ignore
          retention-days: 14
