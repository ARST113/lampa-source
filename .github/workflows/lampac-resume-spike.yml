name: Lampac Resume Spike

on:
  push:
    branches:
      - spike/lampac-resume-e2e-20260908
    paths:
      - 'spike/lampac-resume.RUN'

permissions:
  contents: read

jobs:
  resume-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAMPA_TEST_LAMPAC_URL: https://lampa-full-stack-lab-r54vrp44jj4cx796-9118.app.github.dev
      LAMPA_TEST_PAGES_URL: https://arst113.github.io/lampa-source/test/
      LAMPA_TEST_TORRSERVER_URL: https://lampa-full-stack-lab-r54vrp44jj4cx796-8090.app.github.dev
      LAB_CODESPACE: lampa-full-stack-lab-r54vrp44jj4cx796

    steps:
      - name: Checkout spike
        uses: actions/checkout@v7

      - name: Start current TorrServer sidecar in real Codespace
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh codespace ssh -c "$LAB_CODESPACE" -- 'docker rm -f lampa-full-stack-torrserver >/dev/null 2>&1 || true; docker pull ghcr.io/yourok/torrserver:latest; docker run -d --name lampa-full-stack-torrserver --restart unless-stopped -p 8090:8090 ghcr.io/yourok/torrserver:latest'

          found=''
          for i in $(seq 1 30); do
            ports="$(gh codespace ports -c "$LAB_CODESPACE" --json sourcePort,visibility,browseUrl 2>/dev/null || true)"
            echo "$ports"
            if printf '%s' "$ports" | grep -q '"sourcePort":8090'; then
              found=1
              break
            fi
            sleep 2
          done
          test -n "$found"

          gh codespace ports visibility 8090:public -c "$LAB_CODESPACE"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$LAMPA_TEST_TORRSERVER_URL/echo"; then exit 0; fi
            sleep 2
          done
          echo 'TorrServer sidecar did not become public' >&2
          exit 1

      - name: Probe real TorrServer viewed timecode contract
        shell: bash
        run: |
          set -euo pipefail
          hash='0123456789abcdef0123456789abcdef01234567'
          echo '=== echo ==='
          curl -fsS "$LAMPA_TEST_TORRSERVER_URL/echo"
          echo
          echo '=== viewed set ==='
          curl -fsS -H 'Content-Type: application/json' -d "{\"action\":\"set\",\"hash\":\"$hash\",\"file_index\":1,\"timecode\":65}" "$LAMPA_TEST_TORRSERVER_URL/viewed"
          echo
          echo '=== viewed list ==='
          curl -fsS -H 'Content-Type: application/json' -d "{\"action\":\"list\",\"hash\":\"$hash\",\"file_index\":1}" "$LAMPA_TEST_TORRSERVER_URL/viewed"
          echo

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lampac Resume core checks
        run: node spike/lampac-resume-core-check.js

      - name: Run Lampac Resume full live browser checks
        run: npx playwright test --config=spike/playwright.resume.full.config.js --workers=1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lampac-resume-spike-${{ github.run_id }}
          path: |
            playwright-report-resume-full/
            test-results/
            spike/lampac-resume-result.json
          if-no-files-found: ignore
          retention-days: 7
