{
  "exceptionHandlerLogTarget": "none",
  "serilog": false,
  "listen": {
    "ip": "any",
    "version": true,
    "ResponseCancelAfter": 10
  },
  "LampaWeb": {
    "initPlugins": {
      "pirate_store": false,
      "jacred": true,
      "tmdbProxy": true,
      "cubProxy": false,
      "online": true,
      "sisi": false,
      "torrserver": true,
      "timecode": true,
      "dlna": false,
      "tracks": false
    }
  },
  "BaseModule": {
    "ValidateRequest": false,
    "ValidateIdentity": false,
    "BlockedBots": false,
    "LoadModules": [
      ".*"
    ],
    "SkipModules": [
      "Catalog",
      "Tracks",
      "Transcoding",
      "WebLog",
      "CacheMedia",
      "ForkPlayerXML",
      "MsxNative",
      "Potok",
      "TelegramAuth",
      "TelegramAuthBot"
    ],
    "Middlewares": {
      "staticFiles": true,
      "staticFilesMappings": {
        ".m4s": "video/mp4",
        ".ts": "video/mp2t",
        ".mp4": "video/mp4",
        ".mkv": "video/x-matroska",
        ".m3u": "application/x-mpegURL",
        ".m3u8": "application/vnd.apple.mpegurl",
        ".webm": "video/webm",
        ".m2ts": "video/MP2T"
      }
    }
  },
  "accsdb": {
    "enable": false
  },
  "WAF": {
    "enable": false
  },
  "lowMemoryMode": true,
  "pool": {
    "BufferMax": 50000000,
    "BufferValidityMinutes": -1,
    "BufferByteSmallMaxCount": 4,
    "BufferByteMediumMaxCount": 1,
    "BufferCharSmallMaxCount": 4,
    "BufferCharMediumMaxCount": 2,
    "BufferWriterSmallMaxCount": 5,
    "StringBuilderLargeMaxCount": 2
  },
  "serverproxy": {
    "verifyip": false,
    "image": {
      "cache_time": 60
    }
  }
}
